services:
  - type: web
    name: vietnam-map-live
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /tmp/game.sqlite
      - key: ADMIN_TOKEN
        generateValue: true
      - key: TIKTOK_SIGN_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_MODEL
        value: eleven_flash_v2_5
